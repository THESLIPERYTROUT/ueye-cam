[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ueye-cam"
version = "0.1.0"
description = "Small, context-managed wrapper around IDS uEye cameras (pyueye) with FITS output"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "THESLIPERYTROUT" }]
dependencies = [
    "numpy",
    "pyueye",
    "astropy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
ueye-cam = "ueye_cam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
